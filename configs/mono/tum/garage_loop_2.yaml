Results:
  save_results: True
  save_dir: "results"
  save_trj: True
  save_trj_kf_intv: 10
  use_gui: False
  eval_rendering: True
  use_wandb: True

Dataset:
  type: 'tum'
  sensor_type: 'monocular'
  dataset_path: "/media/trieu/TRIEU_DATA/garage_2_loop/garage_tum"
  pcd_downsample: 64
  pcd_downsample_init: 32
  adaptive_pointsize: True
  point_size: 0.01

  Calibration:
    fx: 501.4757919305817
    fy: 501.4757919305817
    cx: 421.7953735163109
    cy: 167.65799492501083
    k1: 0.0
    k2: 0.0
    p1: 0.0
    p2: 0.0
    k3: 0.0
    width: 800
    height: 400
    distorted: False
    depth_scale: 1.0
   

Training:
  init_itr_num: 1050
  init_gaussian_update: 100
  init_gaussian_reset: 500
  init_gaussian_th: 0.005
  init_gaussian_extent: 30
  tracking_itr_num: 100
  mapping_itr_num: 150
  gaussian_update_every: 150
  gaussian_update_offset: 50
  gaussian_th: 0.7
  gaussian_extent: 0.5
  gaussian_reset: 2001
  size_threshold: 20
  kf_interval: 2
  window_size: 22
  pose_window: 10
  edge_threshold: 1.1
  rgb_boundary_threshold: 0.01
  motion_prior_weight: 0.01
  motion_vel_weight: 0.1
  motion_yaw_weight: 0.05
  motion_rot_weight: 0.001
  epi_weight: 0.000001
  photometric_huber_delta: 0.03
  depth_huber_delta: 0.05
  scale_prior_weight: 0.0
  scale_prior_target: 0.2
  kf_rotation_deg: 1.0
  kf_forward_ratio: 0.1
  loop_sim3_max_span: 60

  kf_translation: 0.03
  kf_min_translation: 0.05
  kf_overlap: 0.9
  kf_cutoff: 0.3
  prune_mode: 'slam'
  single_thread: False
  spherical_harmonics: False
  frame_stride: 1
  motion_prior_weight: 0.01
  motion_vel_weight: 0.1
  motion_yaw_weight: 0.05
  motion_rot_weight: 0.001
  epi_weight: 0.000001
  kf_acceptance:
    scale_min: 0.4
    scale_max: 2.5
    yaw_deg_max: 25.0
    curvature_deg_max: 120.0
    straightness_min: 0.5
    loss_growth_max: 1.05

  lr:
    cam_rot_delta: 0.003
    cam_trans_delta: 0.001

opt_params:
  iterations: 30000
  position_lr_init: 0.0016
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 30000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.001
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  densification_interval: 100
  opacity_reset_interval: 3000
  densify_from_iter: 500
  densify_until_iter: 15000
  densify_grad_threshold: 0.0002

model_params:
  sh_degree: 0
  source_path: ""
  model_path: ""
  resolution: -1
  white_background: False
  data_device: "cuda"

pipeline_params:
  convert_SHs_python: False
  compute_cov3D_python: False
 
PoseGraph:
  enabled: True
  optimize_on_loop: true
  optimize_every_n_loops: 1
  optimize_every_n_keyframes: null
  max_translation_delta: 3.0
  max_rotation_delta_deg: 15.0
  freeze_active_window: false
  extra_odometry_offsets: []

LoopClosure:
  enabled: True
  enable_rejection: false
  metric_scale: true
  detector: "dinoclip"
  models: ["dinov2", "clip-b32"]
  weights: [0.7, 0.3]
  threshold: 0.8
  min_gap: 60
  cooldown: 30
  max_db: null
  detector_stride: 1
  orb:
    nfeatures: 3000
    ratio_thresh: 0.7
    min_inliers: 60
    min_inlier_ratio: 0.55
    ransac_thresh: 2.0
  validation:
    cycle_ratio: 0.5
    max_reproj_error: 3.0
    max_pose_condition: 10000.0
