Results:
  save_results: True
  save_dir: "results"
  save_trj: True
  save_trj_kf_intv: 10
  use_gui: False
  eval_rendering: False
  use_wandb: True

Dataset:
  type: 'tum'
  sensor_type: 'monocular'
  dataset_path: "/media/trieu/TRIEU_DATA/garden_small_spring/garden_small_spring_TUM"
  pcd_downsample: 64
  pcd_downsample_init: 32
  adaptive_pointsize: True
  point_size: 0.01

  Calibration:
    fx: 306.4922725227081
    fy: 306.14812355174007
    cx: 320.22100395920455
    cy: 234.9227867128218
    k1: -0.04083806866524706
    k2: 0.010512320631044807
    p1: -0.020992672094212645
    p2: 0.008848039004781132
    k3: 0.0                # added: required by cv2.initUndistortRectifyMap
    width: 640            # 4Seasons PiCam resolution
    height: 480
    distorted: False       # dataset is likely pre-rectified
    depth_scale: 1.0       # safe default for monocular (no depth)

Training:
  init_itr_num: 1050
  init_gaussian_update: 100
  init_gaussian_reset: 500
  init_gaussian_th: 0.005
  init_gaussian_extent: 30
  tracking_itr_num: 100
  mapping_itr_num: 150
  gaussian_update_every: 150
  gaussian_update_offset: 50
  gaussian_th: 0.7
  gaussian_extent: 1.0
  gaussian_reset: 2001
  size_threshold: 20
  kf_interval: 5
  window_size: 8
  pose_window: 3
  edge_threshold: 1.1
  rgb_boundary_threshold: 0.01

  kf_translation: 0.08
  kf_min_translation: 0.05
  kf_overlap: 0.9
  kf_cutoff: 0.3
  prune_mode: 'slam'
  single_thread: False
  spherical_harmonics: False

  lr:
    cam_rot_delta: 0.003
    cam_trans_delta: 0.001

opt_params:
  iterations: 30000
  position_lr_init: 0.0016
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 30000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.001
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  densification_interval: 100
  opacity_reset_interval: 3000
  densify_from_iter: 500
  densify_until_iter: 15000
  densify_grad_threshold: 0.0002

model_params:
  sh_degree: 0
  source_path: ""
  model_path: ""
  resolution: -1
  white_background: False
  data_device: "cuda"

pipeline_params:
  convert_SHs_python: False
  compute_cov3D_python: False
  
PoseGraph:
  enabled: True
  optimize_on_loop: true
  optimize_every_n_loops: 1
  max_translation_delta: 3.0
  max_rotation_delta_deg: 15.0
  freeze_active_window: true

LoopClosure:
  enabled: True
  detector: "dinoclip"
  models: ["dinov2", "clip-b32"]
  weights: [0.7, 0.3]
  threshold: 0.85
  min_gap: 120
  cooldown: 60
  max_db: null
  detector_stride: 1
  orb:
    nfeatures: 3000
    ratio_thresh: 0.7
    min_inliers: 80
    min_inlier_ratio: 0.55
    ransac_thresh: 2.0

    